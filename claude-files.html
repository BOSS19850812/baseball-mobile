  <textarea id="service-worker.js" readonly>const CACHE_NAME = &quot;baseball-mobile-v24&quot;;
const FILES_TO_CACHE = [
  &quot;./&quot;,
  &quot;./index.html&quot;,
  &quot;./baseball-mobile.html&quot;,
  &quot;./manifest.json&quot;,
  &quot;./icon-new.png&quot;,
  &quot;./icon-180.png&quot;,
  &quot;./icon-192.png&quot;,
  &quot;./icon-512.png&quot;,
  &quot;./apple-touch-icon.png&quot;
];

self.addEventListener(&quot;install&quot;, event =&gt; {
  event.waitUntil(caches.open(CACHE_NAME).then(cache =&gt; cache.addAll(FILES_TO_CACHE)));
  self.skipWaiting();
});

self.addEventListener(&quot;activate&quot;, event =&gt; {
  event.waitUntil(caches.keys().then(keys =&gt; Promise.all(keys.filter(key =&gt; key !== CACHE_NAME).map(key =&gt; caches.delete(key)))));
  self.clients.claim();
});

self.addEventListener(&quot;message&quot;, event =&gt; {
  if (event.data &amp;&amp; event.data.type === &quot;SKIP_WAITING&quot;) self.skipWaiting();
});

self.addEventListener(&quot;fetch&quot;, event =&gt; {
  const request = event.request;
  const wantsHtml = request.mode === &quot;navigate&quot; || (request.headers.get(&quot;accept&quot;) || &quot;&quot;).includes(&quot;text/html&quot;);
  if (wantsHtml) {
    event.respondWith(fetch(request).then(response =&gt; {
      const copy = response.clone();
      caches.open(CACHE_NAME).then(cache =&gt; cache.put(request, copy));
      return response;
    }).catch(() =&gt; caches.match(request)));
    return;
  }
  event.respondWith(caches.match(request).then(cached =&gt; cached || fetch(request)));
});

  <textarea id="server-8766.js" readonly>const http = require('http');
const fs = require('fs');
const path = require('path');
const root = 'C:/baseball-site';
const types = {'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.png':'image/png','.txt':'text/plain; charset=utf-8'};
const server = http.createServer((req,res)=&gt;{
  let urlPath = decodeURIComponent(req.url.split('?')[0]);
  if (urlPath === '/') urlPath = '/baseball-mobile.html';
  const filePath = path.normalize(path.join(root, urlPath));
  if (!filePath.startsWith(path.normalize(root))) { res.writeHead(403); res.end('forbidden'); return; }
  fs.readFile(filePath, (err,data)=&gt;{
    if (err) { res.writeHead(404, {'content-type':'text/plain; charset=utf-8'}); res.end('not found: '+urlPath); return; }
    res.writeHead(200, {'content-type': types[path.extname(filePath).toLowerCase()] || 'application/octet-stream', 'cache-control':'no-store'});
    res.end(data);
  });
});
server.listen(8766, '127.0.0.1', () =&gt; console.log('http://127.0.0.1:8766/baseball-mobile.html?v=v8'));</textarea>

&lt;script&gt;
const $=id=&gt;document.getElementById(id),LS='bb_mobile_clean_v1',DEF=['投','捕','一','二','三','遊','左','中','右'],POS=[...DEF,'指','打','走','-'];
const bs=()=&gt;({ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,k:0,bb:0,hbp:0,sb:0,sac:0});
const mk=()=&gt;Array.from({length:25},(_,i)=&gt;({pos:i&lt;9?DEF[i]:'-',name:'',stat:bs()}));
let st=load()||{home:'ホーム',away:'ビジター',sub:'携帯用 野球速報',hs:'',as:'',first:'away',inn:1,half:'表',b:0,s:0,o:0,score:{home:Array(9).fill(null),away:Array(9).fill(null)},total:{home:0,away:0},hits:{home:0,away:0},err:{home:0,away:0},r:{1:false,2:false,3:false},rp:{1:null,2:null,3:null},ord:{home:1,away:1},play:'プレーなし',ps:'守備位置をタップして入力',fl:'PLAY',hist:[],snap:[],players:{home:mk(),away:mk()},line:{home:[0,1,2,3,4,5,6,7,8],away:[0,1,2,3,4,5,6,7,8]}};
function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}function save(){localStorage.setItem(LS,JSON.stringify({...st,snap:[]}))}
function norm(){if(st.hs==null)st.hs='';if(st.as==null)st.as='';['home','away'].forEach(t=&gt;{while(st.players[t].length&lt;25)st.players[t].push({pos:'-',name:'',stat:bs()});st.players[t].forEach((p,i)=&gt;{if(!p.stat)p.stat=bs();if(!p.pos)p.pos=i&lt;9?DEF[i]:'-'})})}
function side(){return st.first==='away'?(st.half==='表'?'away':'home'):(st.half==='表'?'home':'away')}function def(){return side()==='home'?'away':'home'}function innIndex(){return Math.min(8,st.inn-1)}function bi(){return st.line[side()][st.ord[side()]-1]}function name(t,i){return st.players[t][i].name||'選手'+(i+1)}function cb(){return st.ord[side()]+'番 '+name(side(),bi())}
function snap(){let c=JSON.parse(JSON.stringify(st));c.snap=[];st.snap.push(c);if(st.snap.length&gt;80)st.snap.shift()}function undo(){if(st.snap.length){let a=st.snap;st=a.pop();st.snap=a;render(true)}}function ss(a,b='',f='PLAY'){st.play=a;st.ps=b;st.fl=f}
function addScore(n){let t=side(),i=innIndex();if(st.score[t][i]==null)st.score[t][i]=0;st.score[t][i]+=n;st.total[t]+=n}function addOut(n=1){st.o+=n}
function clearCount(){st.b=0;st.s=0}function next(){let t=side();st.ord[t]=st.ord[t]%9+1}function change(){if(st.o&lt;3)return;let t=side(),i=innIndex();if(st.score[t][i]==null)st.score[t][i]=0;st.o=0;clearCount();st.r={1:false,2:false,3:false};st.rp={1:null,2:null,3:null};clearLine();if(st.half==='表')st.half='裏';else{st.half='表';if(st.inn&lt;9)st.inn++}}
function bat(k,r=0){if(side()!=='home')return;let s=st.players.home[bi()].stat;if(['1b','2b','3b','hr','out','k'].includes(k))s.ab++;if(['1b','2b','3b','hr'].includes(k))s.h++;if(k==='2b')s.d2++;if(k==='3b')s.d3++;if(k==='hr')s.hr++;if(k==='k')s.k++;if(k==='bb')s.bb++;if(k==='hbp')s.hbp++;s.rbi+=r}
function hlog(t,r=0,b=true){let a=[];if(b)a.push(cb());a.push(t);if(r)a.push('打点'+r);st.hist.push(a.join(' '));if(st.hist.length&gt;120)st.hist.shift()}
const P={left:[270,405,'fly'],center:[500,315,'fly'],right:[730,405,'fly'],thirdBase:[300,600,'ground'],short:[390,540,'ground'],secondBase:[610,540,'ground'],firstBase:[700,600,'ground'],pitcher:[500,610,'ground'],catcher:[500,735,'ground'],hrl:[205,42,'hr'],hrc:[500,20,'hr'],hrr:[795,42,'hr']};
function aimKey(k,label=''){let t=String(label);if(k==='left'){if(/レフト線|三塁線/.test(t))return [135,365,'fly'];if(/左中間/.test(t))return [375,320,'fly'];if(/前|ポテン|テキサス/.test(t))return [285,455,'fly'];if(/オーバー|フェンス|直撃|クッション/.test(t))return [235,300,'fly'];if(/スタンド/.test(t))return [205,42,'hr'];return P.left}if(k==='center'){if(/左中間/.test(t))return [390,300,'fly'];if(/右中間/.test(t))return [610,300,'fly'];if(/前|ポテン|テキサス/.test(t))return [500,430,'fly'];if(/オーバー|フェンス|直撃|クッション/.test(t))return [500,255,'fly'];if(/バックスクリーン/.test(t))return [500,20,'hr'];return P.center}if(k==='right'){if(/ライト線|一塁線/.test(t))return [865,365,'fly'];if(/右中間/.test(t))return [625,320,'fly'];if(/前|ポテン|テキサス/.test(t))return [715,455,'fly'];if(/オーバー|フェンス|直撃|クッション/.test(t))return [765,300,'fly'];if(/スタンド/.test(t))return [795,42,'hr'];return P.right}return P[k]||P.center}
function clearLine(){let l=$('hl'),d=$('hdot');if(l){l.className.baseVal='hitline';l.setAttribute('d','M500 770 L500 770')}if(d){d.className.baseVal='hitdot';d.setAttribute('cx',500);d.setAttribute('cy',770)}}
function draw(k,label=''){let p=aimKey(k,label),[x,y,t]=p,l=$('hl'),d=$('hdot');if(!l)return;let sx=500,sy=770,dx=x-sx,dy=y-sy,path='',cls='hitline show ';if(t==='ground'){let c1x=sx+dx*.28,c1y=sy+dy*.22+24,c2x=sx+dx*.72,c2y=sy+dy*.78+16;path=`M${sx} ${sy} C${c1x} ${c1y} ${c2x} ${c2y} ${x} ${y}`;cls+='ground'}else if(t==='hr'){let c1x=sx+dx*.18,c1y=sy-360,c2x=sx+dx*.76,c2y=Math.max(12,y-210);path=`M${sx} ${sy} C${c1x} ${c1y} ${c2x} ${c2y} ${x} ${y}`;cls+='hr'}else{let c1x=sx+dx*.22,c1y=sy-250,c2x=sx+dx*.78,c2y=y-130;path=`M${sx} ${sy} C${c1x} ${c1y} ${c2x} ${c2y} ${x} ${y}`;cls+='fly'}l.className.baseVal=cls;l.setAttribute('d',path);if(d){d.className.baseVal='hitdot show '+(t==='hr'?'hr':t==='ground'?'ground':'');d.setAttribute('cx',x);d.setAttribute('cy',y)}}
function mv(f,to){if(!st.r[f])return;let p=st.rp[f];st.r[f]=false;st.rp[f]=null;if(to==='H')addScore(1);else{st.r[to]=true;st.rp[to]=p}}
function hit(n,k,l){snap();let b=bi(),r1=st.r[1],r2=st.r[2],r3=st.r[3],p1=st.rp[1],p2=st.rp[2],r=0,nr={1:false,2:false,3:false},np={1:null,2:null,3:null};st.hits[side()]++;clearCount();if(n===1){if(r3){addScore(1);r++}if(r2){nr[3]=true;np[3]=p2}if(r1){nr[2]=true;np[2]=p1}nr[1]=true;np[1]=b}if(n===2){if(r3){addScore(1);r++}if(r2){addScore(1);r++}if(r1){nr[3]=true;np[3]=p1}nr[2]=true;np[2]=b}if(n===3){[r1,r2,r3].forEach(x=&gt;{if(x){addScore(1);r++}});nr[3]=true;np[3]=b}st.r=nr;st.rp=np;draw(k,l);ss(l,r?r+'得点':'',n===1?'HIT':n===2?'DOUBLE':'TRIPLE');bat(n===1?'1b':n===2?'2b':'3b',r);hlog(l,r);next();render()}
function hr(d){snap();let r=1+(st.r[1]?1:0)+(st.r[2]?1:0)+(st.r[3]?1:0);st.hits[side()]++;addScore(r);st.r={1:false,2:false,3:false};st.rp={1:null,2:null,3:null};clearCount();draw(d==='left'?'hrl':d==='right'?'hrr':'hrc');ss('ホームラン',r+'得点','HOME RUN');bat('hr',r);hlog('ホームラン',r);next();render()}
function outp(l,k='secondBase',n=1,kind='out'){snap();addOut(n);clearCount();draw(k);bat(kind);if(st.o&gt;=3){ss('チェンジ','','CHANGE');hlog(l+' チェンジ');next();change()}else{ss(l,'','OUT');hlog(l);next()}render()}
function walk(l='四球',kind='bb'){snap();let b=bi(),r=0;if(st.r[1]&amp;&amp;st.r[2]&amp;&amp;st.r[3]){addScore(1);r++;st.rp[3]=st.rp[2];st.rp[2]=st.rp[1];st.rp[1]=b}else if(st.r[1]&amp;&amp;st.r[2]){st.r[3]=true;st.rp[3]=st.rp[2];st.rp[2]=st.rp[1];st.rp[1]=b}else if(st.r[1]){st.r[2]=true;st.rp[2]=st.rp[1];st.rp[1]=b}else{st.r[1]=true;st.rp[1]=b}clearCount();bat(kind,r);ss(l,'',l);hlog(l,r);next();render()}
function ro(b,l){snap();if(st.r[b]){st.r[b]=false;st.rp[b]=null;addOut(1)}ss(l,b+'塁走者アウト','OUT');hlog(l,0,false);change();render()}
function errBatterText(label,base='1'){return /悪送球/.test(label)?label+' 打者走者'+base+'塁へ':label}
function advanceAll(l){snap();let r=0;if(st.r[3]){mv(3,'H');r++}if(st.r[2])mv(2,3);if(st.r[1])mv(1,2);clearCount();ss(l,r?r+'得点':'走者進塁','RUN');hlog(l,r,false);render()}
function strikeoutPlay(label){snap();addOut(1);clearCount();draw('catcher',label);bat('k');if(st.o&gt;=3){ss('チェンジ','','CHANGE');hlog(label+' チェンジ');next();change()}else{ss(label,'','STRIKEOUT');hlog(label);next()}render()}
function droppedThirdSafe(label,adv=false){snap();let batter=bi(),r1=st.r[1],r2=st.r[2],r3=st.r[3],p1=st.rp[1],p2=st.rp[2],p3=st.rp[3],run=0,nr={1:true,2:false,3:false},np={1:batter,2:null,3:null};clearCount();if(r3){if(adv){addScore(1);run++}else{nr[3]=true;np[3]=p3}}if(r2){nr[adv?3:2]=true;np[adv?3:2]=p2}if(r1){nr[2]=true;np[2]=p1}st.r=nr;st.rp=np;draw('catcher',label);bat('k');ss(label,run?run+'得点':'打者1塁','SAFE');hlog(label,run);next();render()}
function droppedThirdOut(label,adv=false){snap();addOut(1);clearCount();if(adv){if(st.r[3])mv(3,'H');if(st.r[2])mv(2,3);if(st.r[1])mv(1,2)}draw('catcher',label);bat('k');if(st.o&gt;=3){ss('チェンジ','','CHANGE');hlog(label+' チェンジ');next();change()}else{ss(label,adv?'走者進塁':'','OUT');hlog(label);next()}render()}
function outfieldRunnerDoublePlay(base,k,label){
  snap();
  if(st.r[base]){st.r[base]=false;st.rp[base]=null;}
  addOut(2);clearCount();draw(k,label);bat('out');
  if(st.o&gt;=3){ss('チェンジ',label,'DOUBLE PLAY');hlog(label+' チェンジ');next();change()}else{ss(label,base+'塁ランナーアウト','DOUBLE PLAY');hlog(label);next()}
  render();
}
function act(c){let [x,a,b]=c.split(':');if(x==='ball'){snap();st.b++;if(st.b&gt;=4)return walk();ss('ボール',st.b+'ボール','BALL');hlog('ボール',0,false);return render()}if(x==='strike'){snap();st.s++;if(st.s&gt;=3)return outp('三振','center',1,'k');ss('ストライク',st.s+'ストライク','STRIKE');hlog('ストライク',0,false);return render()}if(x==='outonly'){snap();addOut(1);ss(st.o&gt;=3?'チェンジ':'アウト','','OUT');hlog(st.o&gt;=3?'アウト チェンジ':'アウト',0,false);change();return render()}if(x==='ksw')return strikeoutPlay('空振り三振');if(x==='klook')return strikeoutPlay('見逃し三振');if(x==='ktip')return strikeoutPlay('ファウルチップ三振');if(x==='dropksafe')return droppedThirdSafe(a||'振り逃げセーフ',false);if(x==='dropkwildsafe')return droppedThirdSafe(a||'振り逃げ暴投セーフ',true);if(x==='dropkpbsafe')return droppedThirdSafe(a||'振り逃げ捕逸セーフ',true);if(x==='dropkout')return droppedThirdOut(a||'振り逃げアウト',false);if(x==='dropkwildout')return droppedThirdOut(a||'振り逃げ暴投アウト',true);if(x==='dropkpbout')return droppedThirdOut(a||'振り逃げ捕逸アウト',true);if(x==='ofdp1'||x==='ofdp2'||x==='ofdp3')return outfieldRunnerDoublePlay(Number(x.slice(-1)),a,b||'外野ダブルプレイ');if(x==='hit1')return hit(1,a,b||'ヒット');if(x==='hit2')return hit(2,a,b||'二塁打');if(x==='hit3')return hit(3,a,b||'三塁打');if(x==='hr')return hr(a);if(x==='out')return outp(b||'アウト',a);if(x==='dp')return outp(b||'ゲッツー',a,2);if(x==='err'){snap();let label=b||'エラー';let text=errBatterText(label);st.err[def()]++;st.r[1]=true;st.rp[1]=bi();draw(a,label);ss(text,'打者走者1塁','ERROR');hlog(text);next();return render()}if(x==='walk')return walk();if(x==='hbp')return walk('死球','hbp');if(x==='balk')return advanceAll('ボーク');if(x==='wild')return advanceAll(a||'暴投');if(x==='pb')return advanceAll(a||'パスボール');if(x==='mv'){snap();mv(Number(a),b==='H'?'H':Number(b));ss('走者移動','','RUN');return render()}if(x==='sb'){snap();if(a==='1'&amp;&amp;st.r[1])mv(1,2);if(a==='2'&amp;&amp;st.r[2])mv(2,3);ss('盗塁成功','','STEAL');hlog('盗塁成功',0,false);return render()}if(x==='ro')return ro(Number(a),a+'塁走者アウト');if(x==='pick')return ro(Number(a),a+'塁牽制アウト');if(x==='undo')return undo();if(x==='change'){snap();st.o=3;ss('チェンジ','','CHANGE');hlog('チェンジ',0,false);change();return render()}if(x==='newgame'||x==='newgame_keep')return newGame(false);if(x==='newgame_reset')return newGame(true);if(x==='gameset')return finishGame('ゲームセット');if(x==='called')return finishGame('コールドゲーム',a+'回')}

window.addEventListener('beforeinstallprompt',e=&gt;{e.preventDefault();deferredInstallPrompt=e;let s=$('installStatus');if(s)s.textContent='Androidは「アプリとして追加」を押せます'});
function installApp(){let s=$('installStatus');if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(choice=&gt;{if(s)s.textContent=choice.outcome==='accepted'?'ホーム画面に追加しました':'追加をキャンセルしました';deferredInstallPrompt=null});return}showInstallHelp()}
function copyHtmlStatus(msg){let el=$('copyHtmlStatus');if(el)el.textContent=msg}
async function getPageHtmlForCopy(){try{let res=await fetch(location.href,{cache:'no-store'});if(res.ok)return await res.text()}catch(e){}return '&lt;!doctype html&gt;\n'+document.documentElement.outerHTML}
async function showPageHtml(){let box=$('copyHtmlBox');if(!box)return;box.value=await getPageHtmlForCopy();copyHtmlStatus('HTMLコードを表示しました')}
async function copyPageHtml(){let box=$('copyHtmlBox');let text=await getPageHtmlForCopy();if(box)box.value=text;try{await navigator.clipboard.writeText(text);copyHtmlStatus('コピーしました。右側に貼れます')}catch(e){if(box){box.focus();box.select();document.execCommand('copy')}copyHtmlStatus('選択しました。コピーできない時は長押しでコピーしてください')}}
function showInstallHelp(){let s=$('installStatus');if(!s)return;let ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);s.textContent=ios?'iPhoneは下の共有ボタン → ホーム画面に追加 → 追加 の順です':'ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を押してください'}

if(window.matchMedia&amp;&amp;window.matchMedia('(display-mode: standalone)').matches){let s=$('installStatus');if(s)s.textContent='アプリ表示で起動中です'}
const APP_BUILD='v24';
function setUpdateStatus(msg){let s=$('installStatus');if(s)s.textContent=msg}
function refreshToLatest(){let url=new URL(location.href);url.searchParams.set('v',APP_BUILD);location.replace(url.toString())}
function setupAutoUpdate(){
  setUpdateStatus('最新版確認中 '+APP_BUILD);
  if(!('serviceWorker' in navigator)){setUpdateStatus('最新版 '+APP_BUILD);return}
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=&gt;{if(refreshing)return;refreshing=true;refreshToLatest()});
  navigator.serviceWorker.register('./service-worker.js').then(reg=&gt;{
    function watch(worker){if(!worker)return;worker.addEventListener('statechange',()=&gt;{if(worker.state==='installed'&amp;&amp;navigator.serviceWorker.controller){worker.postMessage({type:'SKIP_WAITING'});setUpdateStatus('新しい版を反映中')}})}
    watch(reg.installing);watch(reg.waiting);
    reg.addEventListener('updatefound',()=&gt;watch(reg.installing));
    reg.update().then(()=&gt;setUpdateStatus('最新版 '+APP_BUILD)).catch(()=&gt;setUpdateStatus('最新版 '+APP_BUILD));
    setInterval(()=&gt;reg.update().catch(()=&gt;{}),60000);
  }).catch(()=&gt;setUpdateStatus('最新版 '+APP_BUILD));
  let urlBuild=new URLSearchParams(location.search).get('v');
  if(urlBuild!==APP_BUILD){history.replaceState(null,'',location.pathname+'?v='+APP_BUILD+location.hash)}
}
window.addEventListener('load',setupAutoUpdate);
