<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>野球速報 閲覧専用</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
    .app{width:100%;max-width:520px;margin:0 auto;min-height:100dvh;background:#000;padding-bottom:env(safe-area-inset-bottom)}
    .top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#111 0%,#000 100%);padding:calc(12px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #333;text-align:center}
    .title{font-size:20px;font-weight:900;letter-spacing:1px}.sub{font-size:12px;color:#999;margin-top:4px}
    .live-badge{display:inline-block;background:#f2b83a;color:#000;font-size:10px;font-weight:900;padding:2px 8px;border-radius:10px;margin-left:8px;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;margin:10px 12px;overflow:hidden}.head{padding:10px 12px;color:#f2b83a;border-bottom:1px solid #1a1a1a;font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}.head::before{content:'';display:inline-block;width:3px;height:14px;background:#f2b83a;border-radius:2px}.small{padding:10px 12px;color:#ddd;font-size:14px;line-height:1.7}
    table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #222;text-align:center;padding:6px 2px;font-size:11px}th{color:#888;font-weight:400;background:#0a0a0a}.team{width:52px;font-weight:900;text-align:left;padding-left:6px}.sum{background:#111;font-weight:900}.now{color:#f2b83a;font-weight:900;background:rgba(242,184,58,.08)}
    .hist{max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}.item{padding:10px 12px;border-bottom:1px solid #151515;font-size:13px;line-height:1.5}.item:last-child{border-bottom:none}.item:first-child{color:#f2b83a;font-weight:700}.orders table th{background:#111;color:#f2b83a;font-weight:700;font-size:12px}.orders table td{font-size:12px;padding:6px 4px}
    .meta{color:#f2b83a;font-size:12px;font-weight:700;margin-top:6px}.viewers-count{color:#888;font-size:11px;margin-top:4px}.error{padding:40px 20px;color:#f2b83a;font-weight:900;text-align:center;font-size:15px}.update-dot{display:inline-block;width:6px;height:6px;background:#4ade80;border-radius:50%;margin-right:6px}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title" id="ttl">野球速報<span class="live-badge" id="liveBadge" style="display:none">LIVE</span></div><div class="sub" id="sub">読み込み中...</div></div>
  <div id="error" class="card error" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="card"><div class="head">スコア</div><div id="scoreGameSub" class="small"></div><div id="score"></div></div>
    <div class="card"><div class="head">試合状況</div><div class="small"><b id="inn"></b><br><span id="cur"></span><div id="starters" class="meta"></div><div id="updated" class="meta"><span class="update-dot"></span><span id="updatedTime"></span></div><div id="viewerCount" class="viewers-count"></div></div></div>
    <div class="card"><div class="head">速報履歴</div><div class="hist" id="hist"></div></div>
    <div class="card orders"><div class="head">スタメン</div><div id="orders"></div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let st=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function side(){return st.first==='away'?(st.half==='表'?'away':'home'):(st.half==='表'?'home':'away')}
function innIndex(){return Math.min(8,(Number(st.inn)||1)-1)}
function name(t,i){let p=st.players&&st.players[t]&&st.players[t][i];return (p&&p.name)||'選手'+(Number(i)+1)}
function score(){let top=st.first==='away'?'away':'home',bot=top==='away'?'home':'away';let rows=[top,bot].map(t=>`<tr><td class="team">${esc((t==='home'?st.home:st.away)||'').slice(0,4)}</td>${(st.score[t]||[]).map((v,i)=>`<td class="${side()===t&&innIndex()===i?'now':''}">${v==null?'':esc(v)}</td>`).join('')}<td class="sum">${esc(st.total[t]||0)}</td><td class="sum">${esc(st.hits[t]||0)}</td><td class="sum">${esc(st.err[t]||0)}</td></tr>`).join('');return `<table><thead><tr><th class="team"></th>${[1,2,3,4,5,6,7,8,9].map(n=>`<th>${n}</th>`).join('')}<th>計</th><th>安</th><th>失</th></tr></thead><tbody>${rows}</tbody></table>`}
function orderTable(){return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#222"><div style="background:#0a0a0a"><div style="padding:8px;color:#f2b83a;font-weight:900;font-size:13px;text-align:center;border-bottom:1px solid #222">${esc(st.home||'ホーム')}</div>${Array.from({length:9},(_,i)=>{let hi=st.line.home[i],hp=st.players.home[hi]||{};return `<div style="padding:6px 8px;border-bottom:1px solid #151515;font-size:12px;display:flex;gap:6px"><span style="color:#888;min-width:16px">${i+1}</span><span style="color:#888;min-width:20px">${esc(hp.pos||'')}</span><span>${esc(name('home',hi))}</span></div>`}).join('')}</div><div style="background:#0a0a0a"><div style="padding:8px;color:#f2b83a;font-weight:900;font-size:13px;text-align:center;border-bottom:1px solid #222">${esc(st.away||'ビジター')}</div>${Array.from({length:9},(_,i)=>{let ai=st.line.away[i],ap=st.players.away[ai]||{};return `<div style="padding:6px 8px;border-bottom:1px solid #151515;font-size:12px;display:flex;gap:6px"><span style="color:#888;min-width:16px">${i+1}</span><span style="color:#888;min-width:20px">${esc(ap.pos||'')}</span><span>${esc(name('away',ai))}</span></div>`}).join('')}</div></div>`}
function render(updatedAt,viewers){$('content').style.display='block';$('error').style.display='none';$('ttl').innerHTML=esc((st.home||'ホーム')+' vs '+(st.away||'ビジター'))+'<span class="live-badge" id="liveBadge">LIVE</span>';$('sub').textContent='閲覧専用';$('scoreGameSub').textContent=st.sub||'';$('score').innerHTML=score();$('inn').textContent=(st.inn||1)+'回'+(st.half||'表');$('cur').textContent=st.play||'プレーなし';$('starters').textContent='先発投手　'+(st.home||'ホーム')+': '+(st.hs||'未入力')+'　/　'+(st.away||'ビジター')+': '+(st.as||'未入力');$('updatedTime').textContent=updatedAt?'最終更新 '+new Date(updatedAt).toLocaleTimeString('ja-JP'):'';if(viewers!=null)$('viewerCount').textContent='閲覧中: '+viewers+'人';$('hist').innerHTML=(st.hist&&st.hist.length)?st.hist.slice().reverse().map(x=>'<div class="item">'+esc(x)+'</div>').join(''):'<div class="item" style="color:#666">履歴なし</div>';$('orders').innerHTML=orderTable()}
function showError(msg){$('content').style.display='none';$('error').style.display='block';$('error').textContent=msg}
async function load(){let token=new URLSearchParams(location.search).get('game')||'';if(!token){showError('閲覧URLが指定されていません');return}try{let res=await fetch('/api/view-game?token='+encodeURIComponent(token),{credentials:'same-origin'});let data=await res.json();if(!res.ok)throw new Error(data.error||'読み込みできません');st=data.state;render(data.updatedAt,data.viewers)}catch(e){showError(e.message)}}
load();setInterval(load,3000);
</script>
</body>
</html>
