<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>野球速報 閲覧専用</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:100%;max-width:520px;margin:0 auto;min-height:100dvh;background:#000}.top{position:sticky;top:0;z-index:10;background:#000;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #222}.title{font-size:18px;font-weight:900}.sub{font-size:12px;color:#bbb;margin-top:2px}.card{background:#050505;border:1px solid #222;border-radius:8px;margin:8px;overflow:hidden}.head{padding:8px;color:#f2b83a;border-bottom:1px solid #222;font-size:13px;font-weight:900}.small{padding:8px;color:#ddd;font-size:13px;line-height:1.6}.meta{color:#f2b83a;font-size:12px;font-weight:900;margin-top:5px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #222;text-align:center;padding:5px 1px;font-size:10px}th{color:#bbb}.team{width:48px;font-weight:900}.sum{background:#111;font-weight:900}.now{color:#f2b83a;font-weight:900}.hist{max-height:310px;overflow:auto}.item{padding:7px;border-bottom:1px solid #222;font-size:13px;line-height:1.45}.error{padding:20px;color:#f2b83a;font-weight:900;text-align:center}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title" id="ttl">野球速報 閲覧専用</div><div class="sub" id="sub">読み込み中</div></div>
  <div id="error" class="card error" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="card"><div class="head">スコア</div><div id="scoreGameSub" class="small"></div><div id="score"></div></div>
    <div class="card"><div class="head">試合状況</div><div class="small"><b id="inn"></b><br><span id="cur"></span><div id="starters" class="meta"></div><div id="updated" class="meta"></div></div></div>
    <div class="card"><div class="head">速報履歴</div><div class="hist" id="hist"></div></div>
    <div class="card"><div class="head">スタメン</div><div id="orders"></div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let st=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function side(){return st.first==='away'?(st.half==='表'?'away':'home'):(st.half==='表'?'home':'away')}
function innIndex(){return Math.min(8,(Number(st.inn)||1)-1)}
function name(t,i){let p=st.players&&st.players[t]&&st.players[t][i];return (p&&p.name)||'選手'+(Number(i)+1)}
function score(){let top=st.first==='away'?'away':'home',bot=top==='away'?'home':'away';let rows=[top,bot].map(t=>`<tr><td class="team">${esc((t==='home'?st.home:st.away)||'').slice(0,4)}</td>${(st.score[t]||[]).map((v,i)=>`<td class="${side()===t&&innIndex()===i?'now':''}">${v==null?'':esc(v)}</td>`).join('')}<td class="sum">${esc(st.total[t]||0)}</td><td class="sum">${esc(st.hits[t]||0)}</td><td class="sum">${esc(st.err[t]||0)}</td></tr>`).join('');return `<table><thead><tr><th class="team"></th>${[1,2,3,4,5,6,7,8,9].map(n=>`<th>${n}</th>`).join('')}<th>計</th><th>安</th><th>失</th></tr></thead><tbody>${rows}</tbody></table>`}
function orderTable(){return `<table><thead><tr><th colspan="3">${esc(st.home)}</th><th colspan="3">${esc(st.away)}</th></tr></thead><tbody>${Array.from({length:9},(_,i)=>{let hi=st.line.home[i],ai=st.line.away[i],hp=st.players.home[hi]||{},ap=st.players.away[ai]||{};return `<tr><td>${i+1}</td><td>${esc(hp.pos||'')}</td><td>${esc(name('home',hi))}</td><td>${i+1}</td><td>${esc(ap.pos||'')}</td><td>${esc(name('away',ai))}</td></tr>`}).join('')}</tbody></table>`}
function render(updatedAt){$('content').style.display='block';$('error').style.display='none';$('ttl').textContent=(st.home||'ホーム')+' vs '+(st.away||'ビジター');$('sub').textContent='閲覧専用';$('scoreGameSub').textContent=st.sub||'試合表示未入力';$('score').innerHTML=score();$('inn').textContent=(st.inn||1)+'回'+(st.half||'表');$('cur').textContent=st.play||'プレーなし';$('starters').textContent='先発投手　'+(st.home||'ホーム')+': '+(st.hs||'未入力')+'　/　'+(st.away||'ビジター')+': '+(st.as||'未入力');$('updated').textContent=updatedAt?'更新 '+new Date(updatedAt).toLocaleTimeString('ja-JP'):'';$('hist').innerHTML=(st.hist&&st.hist.length)?st.hist.slice().reverse().map(x=>`<div class="item">${esc(x)}</div>`).join(''):'<div class="item">履歴なし</div>';$('orders').innerHTML=orderTable()}
function showError(msg){$('content').style.display='none';$('error').style.display='block';$('error').textContent=msg}
async function load(){let token=new URLSearchParams(location.search).get('game')||'';if(!token){showError('閲覧URLが指定されていません');return}try{let res=await fetch('/api/view-game?token='+encodeURIComponent(token),{credentials:'same-origin'});let data=await res.json();if(!res.ok)throw new Error(data.error||'読み込みできません');st=data.state;render(data.updatedAt)}catch(e){showError(e.message)}}
load();setInterval(load,3000);
</script>
</body>
</html>
